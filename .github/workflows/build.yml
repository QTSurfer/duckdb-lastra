name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (amd64)
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-amd64

      - name: Build
        run: make release

      - name: Test
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: lastra-linux-amd64
          path: build/release/extension/lastra/lastra.duckdb_extension

  wasm:
    name: WASM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.72

      - name: Build WASM
        run: |
          mkdir -p build/wasm && cd build/wasm
          emcmake cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXTENSION_NAMES="lastra" \
            -DDUCKDB_EXTENSION_LASTRA_PATH="$GITHUB_WORKSPACE" \
            -DWASM_LOADABLE_EXTENSIONS=1 \
            -DSKIP_EXTENSIONS="parquet;json" \
            ../../duckdb
          emmake make -j$(nproc) lastra_loadable_extension

      - uses: actions/upload-artifact@v4
        with:
          name: lastra-wasm
          path: build/wasm/extension/lastra/lastra.duckdb_extension.wasm
