name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DUCKDB_VERSION: v1.3.0

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache DuckDB source
        uses: actions/cache@v4
        with:
          path: duckdb
          key: duckdb-src-${{ env.DUCKDB_VERSION }}

      - name: Clone DuckDB
        if: ${{ !hashFiles('duckdb/CMakeLists.txt') }}
        run: |
          rm -rf duckdb
          git clone --depth 1 --branch $DUCKDB_VERSION https://github.com/duckdb/duckdb.git duckdb

      - name: Create extension symlink
        run: mkdir -p duckdb/extension_external && ln -sf $GITHUB_WORKSPACE duckdb/extension_external/lastra

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-${{ env.DUCKDB_VERSION }}

      - name: Build
        run: |
          mkdir -p build/release && cd build/release
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DDUCKDB_EXTENSION_NAMES="lastra" \
                -DDUCKDB_EXTENSION_LASTRA_PATH="$GITHUB_WORKSPACE" \
                -DDUCKDB_EXTENSION_LASTRA_SHOULD_LINK=1 \
                -DDUCKDB_EXTENSION_LASTRA_LOAD_TESTS=1 \
                ../../duckdb
          cmake --build . --config Release -- -j$(nproc)

      - name: Test
        run: |
          echo "SELECT count(*) FROM read_lastra('$GITHUB_WORKSPACE/test/fixtures/series-only.lastra');" | build/release/duckdb
          echo "SELECT count(*), min(close), max(close) FROM read_lastra('$GITHUB_WORKSPACE/test/fixtures/row-groups.lastra');" | build/release/duckdb

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: lastra-linux-amd64
          path: build/release/extension/lastra/lastra.duckdb_extension

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache DuckDB source
        uses: actions/cache@v4
        with:
          path: duckdb
          key: duckdb-src-${{ env.DUCKDB_VERSION }}

      - name: Clone DuckDB
        if: ${{ !hashFiles('duckdb/CMakeLists.txt') }}
        run: |
          rm -rf duckdb
          git clone --depth 1 --branch $DUCKDB_VERSION https://github.com/duckdb/duckdb.git duckdb

      - name: Create extension symlink
        run: mkdir -p duckdb/extension_external && ln -sf $GITHUB_WORKSPACE duckdb/extension_external/lastra

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.72

      - name: Build WASM
        run: |
          mkdir -p build/wasm && cd build/wasm
          emcmake cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXTENSION_NAMES="lastra" \
            -DDUCKDB_EXTENSION_LASTRA_PATH="$GITHUB_WORKSPACE" \
            -DWASM_LOADABLE_EXTENSIONS=1 \
            -DSKIP_EXTENSIONS="parquet;json" \
            ../../duckdb
          emmake make -j$(nproc) lastra_loadable_extension

      - name: Upload WASM extension
        uses: actions/upload-artifact@v4
        with:
          name: lastra-wasm
          path: build/wasm/extension/lastra/lastra.duckdb_extension.wasm
