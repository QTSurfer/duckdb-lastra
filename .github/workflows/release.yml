name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: release

      - name: Build native
        run: make release

      - name: Test
        run: make test

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.72

      - name: Build WASM
        # `make wasm_mvp` invokes `emmake make -Cbuild/wasm_mvp`, which needs
        # plain Unix Makefiles in the build dir — but the job-level
        # `GEN: ninja` env tells CMake to emit Ninja files, so emmake hits
        # "No targets specified and no makefile found." Override per-step.
        env:
          GEN: ""
        run: make wasm_mvp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/wasm_mvp/extension/lastra/lastra.duckdb_extension.wasm
            build/release/extension/lastra/lastra.duckdb_extension
          body: |
            ## duckdb-lastra ${{ github.ref_name }}

            DuckDB extension for reading Lastra columnar time series files.

            ### Install
            ```sql
            INSTALL lastra FROM community;
            LOAD lastra;
            SELECT * FROM 'data.lastra';
            ```

            ### Files
            - `lastra.duckdb_extension.wasm` — WebAssembly (DuckDB-WASM)
            - `lastra.duckdb_extension` — Linux amd64
