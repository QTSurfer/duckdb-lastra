name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GEN: ninja
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: release

      - name: Build native
        run: make release

      - name: Test
        run: make test

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.72

      - name: Build WASM
        run: |
          mkdir -p build/wasm && cd build/wasm
          emcmake cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUCKDB_EXTENSION_NAMES="lastra" \
            -DDUCKDB_EXTENSION_LASTRA_PATH="$GITHUB_WORKSPACE" \
            -DWASM_LOADABLE_EXTENSIONS=1 \
            -DSKIP_EXTENSIONS="parquet;json" \
            ../../duckdb
          emmake make -j$(nproc) lastra_loadable_extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/wasm/extension/lastra/lastra.duckdb_extension.wasm
            build/release/extension/lastra/lastra.duckdb_extension
          body: |
            ## duckdb-lastra ${{ github.ref_name }}

            DuckDB extension for reading Lastra columnar time series files.

            ### Install
            ```sql
            INSTALL lastra FROM community;
            LOAD lastra;
            SELECT * FROM 'data.lastra';
            ```

            ### Files
            - `lastra.duckdb_extension.wasm` — WebAssembly (DuckDB-WASM)
            - `lastra.duckdb_extension` — Linux amd64
